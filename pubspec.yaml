name: smartdoor
description: "Application interface for Wi-Fi based door lock system"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2960.0
  google_fonts: ^8.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod: ^3.4.2
  flutter_riverpod: ^3.4.2
  http: ^1.6.0
  flutter_secure_storage: ^11.0.0
  network_info_plus: ^8.2.1
  connectivity_plus: ^7.3.1
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  fastforge:
    git:
      url: https://github.com/duskygloom/flutter_distributor
      ref: hans
      path: packages/fastforge

flutter:

  uses-material-design: true

