output: dist/

releases:
  - name: linux-build
    jobs:
      - name: release-android
        package:
          platform: android
          target: apk
          build_args:
            split-per-abi:

      - name: release-linux
        package:
          platform: linux
          target: appimage

  - name: windows-build
    jobs:
      - name: release-windows
        package:
          platform: windows
          target: exe
